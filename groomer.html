<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d1f0d">
<title>HomePaw — Jadwal Groomer</title>
<style>
html{-webkit-text-size-adjust:100%}
:root{
 --bg:#fdf8f0;
 --surface:#fff;
 --text:#2a1810;
 --muted:#7a6b5c;
 --border:#e8d5b7;
 --subtle:#fdf3e7;
 --primary:#e07b39;
 --primary-dk:#b85c1f;
 --green:#16a34a;
 --red:#dc2626;
 --yellow:#ca8a04;
 --sh:0 1px 3px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}

.app{max-width:600px;margin:0 auto;padding:0 0 80px}

.hdr{background:linear-gradient(135deg,#3d1f0d,#e07b39);color:#fff;padding:18px 16px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hdr-name{font-size:18px;font-weight:700;margin:0}
.hdr-sub{font-size:11px;opacity:.9;margin-top:2px}
.hdr-refresh{background:rgba(255,255,255,.18);border:none;color:#fff;padding:8px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-weight:500;min-height:36px}
.hdr-refresh:active{background:rgba(255,255,255,.3)}

.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:74px;z-index:9}
.tab{flex:1;background:none;border:none;padding:12px 8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;font-family:inherit;min-height:48px}
.tab.active{color:var(--primary-dk);border-bottom-color:var(--primary);background:var(--subtle)}
.tab .count{display:inline-block;background:var(--primary);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;margin-left:5px;font-weight:700;min-width:18px}
.tab.active .count{background:var(--primary-dk)}

.content{padding:14px 12px}

.appt{background:var(--surface);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);border-left:4px solid var(--primary)}
.appt.done{opacity:.55;border-left-color:var(--green)}
.appt.pending{border-left-color:var(--yellow)}
.appt-time{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.appt-time-big{font-size:20px;font-weight:700;color:var(--primary-dk)}
.appt-duration{font-size:11px;color:var(--muted);font-weight:500;background:var(--subtle);padding:2px 7px;border-radius:4px}
.appt-status{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:600;padding:3px 8px;border-radius:4px;background:#dbeafe;color:#1e40af;margin-left:auto}
.appt-status.pending{background:#fef3c7;color:#92400e}
.appt-status.done{background:#dcfce7;color:#15803d}
.appt-status.confirmed{background:#dbeafe;color:#1e40af}

.appt-cust{font-size:16px;font-weight:600;margin-bottom:4px}
.appt-addr{font-size:13px;color:var(--text);margin-bottom:10px;line-height:1.4}
.appt-addr a{color:var(--primary-dk);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:4px;margin-top:4px;padding:6px 12px;background:var(--subtle);border-radius:6px;border:1px solid var(--border);min-height:36px}
.appt-addr a:active{background:var(--border)}

.dog-card{background:var(--subtle);border-radius:8px;padding:10px 12px;margin-bottom:6px;border:1px solid var(--border)}
.dog-name{font-size:15px;font-weight:600;color:var(--text)}
.dog-meta{font-size:12px;color:var(--muted);margin-top:3px}
.dog-svc{font-size:13px;color:var(--primary-dk);font-weight:600;margin-top:6px;padding:4px 8px;background:#fff;border-radius:5px;display:inline-block}
.dog-prefs{font-size:12px;font-style:italic;color:#5a4a3a;margin-top:6px;padding:6px 8px;background:#fff;border-left:3px solid var(--primary);border-radius:0 5px 5px 0}
.dog-skin{font-size:12px;color:#92400e;background:#fef3c7;padding:8px 10px;border-radius:6px;margin-top:6px;border-left:3px solid var(--yellow)}
.dog-skin strong{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.dog-styling{margin-top:8px}
.dog-styling-label{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.dog-styling-imgs{display:flex;gap:6px;flex-wrap:wrap}
.dog-styling-imgs a{display:block}
.dog-styling-imgs img{width:80px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--border)}

.appt-note{margin-top:8px;font-size:12px;color:#444;background:#fff7ed;padding:6px 10px;border-radius:5px;border-left:3px solid var(--primary)}

.day-section{margin-bottom:18px}
.day-header{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);padding:8px 0;margin-bottom:8px;border-bottom:2px solid var(--border)}
.day-header.today{color:var(--primary-dk)}
.day-header.today::after{content:'HARI INI';margin-left:10px;background:var(--primary);color:#fff;padding:2px 8px;border-radius:10px;font-size:9px}

.empty{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:13px;font-style:italic}

.gate{max-width:400px;margin:60px auto;padding:0 20px;text-align:center}
.gate-logo{font-size:24px;font-weight:700;color:var(--primary-dk);margin-bottom:6px}
.gate-tag{font-size:12px;color:var(--muted);margin-bottom:30px}
.gate-card{background:var(--surface);padding:24px;border-radius:12px;box-shadow:var(--sh);text-align:left}
.gate-card h2{font-size:16px;margin:0 0 14px}
.gate-card label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.gate-card input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-size:15px;background:var(--bg);margin-bottom:14px;font-family:inherit;min-height:44px}
.gate-card button{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;min-height:48px}
.gate-card button:active{background:var(--primary-dk)}
.gate-err{font-size:12px;color:var(--red);margin-top:10px;padding:8px 12px;background:#fee2e2;border-radius:5px;border:1px solid #fca5a5}

.loader{text-align:center;padding:3rem 1rem;color:var(--muted)}
.spin{display:inline-block;width:20px;height:20px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp 0.7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}

.footer{text-align:center;font-size:10px;color:var(--muted);padding:16px 12px;margin-top:20px}

.checklist{background:var(--surface);border-radius:10px;padding:14px;margin-bottom:16px;box-shadow:var(--sh);border:2px solid var(--primary)}
.checklist-title{font-size:13px;font-weight:700;color:var(--primary-dk);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.checklist-toggle{background:none;border:none;font-size:11px;color:var(--muted);cursor:pointer;font-weight:600;padding:4px 8px;min-height:32px}
.checklist-body{display:flex;flex-direction:column;gap:4px}
.checklist-body.collapsed{display:none}
.chk-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:40px}
.chk-item:active{background:var(--subtle)}
.chk-item.checked{opacity:.45;text-decoration:line-through}
.chk-box{width:22px;height:22px;border:2px solid var(--border);border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--green);background:var(--surface)}
.chk-item.checked .chk-box{border-color:var(--green);background:#dcfce7}
.chk-label{font-size:13px;font-weight:500;flex:1}
.chk-reason{font-size:10px;color:var(--muted);font-weight:400}

.appt-photos{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.appt-photos .full{grid-column:1/-1}
.photo-slot{position:relative}
.photo-slot-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:3px;text-align:center}
.photo-btn{width:100%;aspect-ratio:4/3;border:2px dashed var(--border);border-radius:8px;background:var(--subtle);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;gap:2px;min-height:70px}
.photo-btn:active{background:var(--border)}
.photo-btn-icon{font-size:20px;line-height:1}
.photo-btn-text{font-size:10px;color:var(--muted);font-weight:500}
.photo-preview{width:100%;aspect-ratio:4/3;border-radius:8px;overflow:hidden;position:relative;border:1px solid var(--border)}
.photo-preview img{width:100%;height:100%;object-fit:cover}
.photo-del{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:14px;line-height:24px;text-align:center;cursor:pointer;padding:0}
.photo-del:active{background:rgba(220,38,38,.9)}
.photo-retake{position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:5px;font-size:9px;padding:3px 7px;cursor:pointer;font-weight:600;min-height:24px}
.photo-uploading{width:100%;aspect-ratio:4/3;border:2px solid var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--subtle)}
.photo-uploading .spin{width:14px;height:14px}
.photo-meta{font-size:11px;color:#374151;background:#f3f4f6;text-align:center;margin-top:4px;line-height:1.4;padding:3px 5px;border-radius:4px;font-weight:500}
.photo-meta .ts-fresh{color:#16a34a;font-weight:700}
.photo-meta .ts-old{color:#6b7280}
.photo-section-label{grid-column:1/-1;font-size:10px;font-weight:700;color:var(--primary-dk);text-transform:uppercase;letter-spacing:.5px;padding:6px 0 2px;border-top:1px solid var(--border);margin-top:4px}
.photo-multi{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.photo-multi .photo-slot{width:calc(50% - 3px);flex:none}
.photo-multi .photo-add{width:calc(50% - 3px);flex:none}
</style>
</head>
<body>

<!-- Lightbox overlay for photo enlargement (click any photo to open) -->
<div id="lightbox" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;background:rgba(0,0,0,.92);z-index:9999;align-items:center;justify-content:center;cursor:zoom-out;flex-direction:column;padding:20px;box-sizing:border-box" onclick="closeLightbox()">
 <img id="lightbox-img" src="" alt="Photo preview" style="max-width:100%;max-height:calc(100vh - 90px);max-height:calc(100dvh - 90px);object-fit:contain;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.5)"/>
 <button onclick="event.stopPropagation();closeLightbox()" style="position:absolute;top:20px;right:20px;width:44px;height:44px;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:24px;border-radius:50%;cursor:pointer;font-weight:700;line-height:1">&times;</button>
 <div style="color:#e5e7eb;font-size:12px;margin-top:12px;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:6px">Tap di mana saja untuk tutup</div>
</div>

<div id="app-wrap" class="app" style="display:none">
 <div class="hdr">
  <div class="hdr-row">
   <div>
    <div class="hdr-name" id="g-name">HomePaw Groomer</div>
    <div class="hdr-sub" id="g-sub">Loading…</div>
   </div>
   <button class="hdr-refresh" onclick="loadSchedule()">Refresh</button>
  </div>
 </div>

 <div class="tabs">
  <button class="tab active" id="tab-today" onclick="switchTab('today')">Hari Ini <span class="count" id="cnt-today">0</span></button>
  <button class="tab" id="tab-tomorrow" onclick="switchTab('tomorrow')">Besok <span class="count" id="cnt-tomorrow">0</span></button>
  <button class="tab" id="tab-later" onclick="switchTab('later')">2-3 Hari <span class="count" id="cnt-later">0</span></button>
 </div>

 <div class="content" id="content"><div class="loader"><span class="spin"></span>Loading schedule…</div></div>

 <div class="footer">HomePaw — Jadwal grooming, read-only.<br/>Bookmark this page on your phone. Refresh untuk update.</div>
</div>

<div id="gate" class="gate" style="display:none">
 <div class="gate-logo">HomePaw</div>
 <div class="gate-tag">Halaman jadwal groomer</div>
 <div class="gate-card">
  <h2>Login Groomer</h2>
  <div>
   <label>Nama groomer</label>
   <input id="gate-name" placeholder="Nama anda" autocomplete="off" autocapitalize="words"/>
  </div>
  <div>
   <label>Access code</label>
   <input id="gate-token" placeholder="Kode dari Xavier" autocomplete="off"/>
  </div>
  <button onclick="tryLogin()">Buka jadwal</button>
  <div id="gate-err" class="gate-err" style="display:none"></div>
 </div>
 <div style="margin-top:20px;font-size:11px;color:var(--muted)">Tidak punya akses? Hubungi Xavier untuk dapat kode.</div>
</div>

<input type="file" id="cam-input" accept="image/*" capture="environment" style="display:none" onchange="onPhotoCapture(this)"/>
<input type="file" id="cam-gallery" accept="image/*" style="display:none" onchange="onPhotoCapture(this)"/>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://cwqrpslypcjgjuxagglc.supabase.co";
const SUPABASE_ANON="sb_publishable_z7OIHRFpPcFic3udtI_BKA_9eam1nvv";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);

let currentGroomer=null;
let currentTab='today';
let dataCache={appts:[],dogs:[],custs:[]};

// Parse URL: ?name=irgih&token=abc123
function parseURL(){
 const p=new URLSearchParams(window.location.search);
 return {name:(p.get('name')||p.get('g')||'').trim(), token:(p.get('token')||p.get('t')||'').trim()};
}

function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

const APPT_TRANSPORT_FEE_RE=/(?:^|\n)\[\[HP_TRANSPORT_FEE:(\d+)\]\](?=\n|$)/g;
function getApptTransportFee(apptOrNote){
 const note=typeof apptOrNote==='string'?apptOrNote:(apptOrNote?.admin_note||'');
 let fee=0,match;
 APPT_TRANSPORT_FEE_RE.lastIndex=0;
 while((match=APPT_TRANSPORT_FEE_RE.exec(note))!==null) fee=Math.max(fee,parseInt(match[1])||0);
 APPT_TRANSPORT_FEE_RE.lastIndex=0;
 return fee;
}
function fmtRp(n){return 'Rp '+(Number(n)||0).toLocaleString('id-ID')}
function photoUrl(v){return v&&typeof v==='object'?(v.url||null):(v||null)}
function photoTS(v){return v&&typeof v==='object'?(v.timestamp||null):null}
const LATE_GRACE_MINUTES=15;

/* Session E — Lightbox for enlarging any photo. Click photo → open full-screen.
   Click anywhere or Escape → close. */
function openLightbox(url,imgEl){
 const lb=document.getElementById('lightbox');
 const img=document.getElementById('lightbox-img');
 if(!lb||!img) return;
 img.src=url;
 lb.style.display='flex';
 document.body.style.overflow='hidden';  // prevent scroll behind lightbox
}
function closeLightbox(){
 const lb=document.getElementById('lightbox');
 if(!lb) return;
 lb.style.display='none';
 document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{
 if(e.key==='Escape') closeLightbox();
});

/* Format a photo upload timestamp — relative for recent, absolute for old */
function fmtPhotoTS(iso){
 if(!iso) return '';
 const dt=new Date(iso);
 if(isNaN(dt.getTime())) return '';
 // Session E — always absolute timestamp per owner spec (no more "5 menit lalu")
 const day=String(dt.getDate()).padStart(2,'0');
 const months=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
 const HH=String(dt.getHours()).padStart(2,'0');
 const MM=String(dt.getMinutes()).padStart(2,'0');
 const label=`${day} ${months[dt.getMonth()]} ${dt.getFullYear()}, ${HH}:${MM}`;
 return `📸 <span class="ts-old">${label}</span>`;
}
function iso(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return`${y}-${m}-${dd}`}
function fmtTime(t){return (t||'').slice(0,5)}
function fmtDateLong(d){return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})}

function showGate(errMsg){
 document.getElementById('app-wrap').style.display='none';
 document.getElementById('gate').style.display='block';
 if(errMsg){
  const e=document.getElementById('gate-err');
  e.textContent=errMsg;e.style.display='block';
 }
}

function showApp(){
 document.getElementById('gate').style.display='none';
 document.getElementById('app-wrap').style.display='block';
}

async function tryLogin(){
 const name=document.getElementById('gate-name').value.trim();
 const token=document.getElementById('gate-token').value.trim();
 if(!name||!token){showGate('Isi nama dan kode dulu.');return}
 // Persist URL with params so refresh works
 const url=new URL(window.location.href);
 url.searchParams.set('name',name.toLowerCase());
 url.searchParams.set('token',token);
 window.history.replaceState({},'',url);
 await init();
}

async function init(){
 const {name,token}=parseURL();
 if(!name||!token){showGate();return}
 // Look up groomer by name (case-insensitive) AND token
 const {data,error}=await db.from('groomers')
  .select('id,name,active,access_token')
  .ilike('name',name)
  .limit(1)
  .maybeSingle();
 if(error){showGate('Error: '+error.message);return}
 if(!data){showGate('Groomer tidak ditemukan. Cek nama anda dan minta Xavier untuk update.');return}
 if(!data.active){showGate('Account tidak aktif. Hubungi Xavier.');return}
 if(!data.access_token||data.access_token!==token){showGate('Access code salah. Cek dari Xavier.');return}
 currentGroomer=data;
 document.getElementById('g-name').textContent=data.name;
 document.getElementById('g-sub').textContent='Jadwal grooming · Read-only';
 showApp();
 await loadSchedule();
}

async function loadSchedule(){
 const content=document.getElementById('content');
 content.innerHTML='<div class="loader"><span class="spin"></span>Loading schedule…</div>';
 const today=new Date(); today.setHours(0,0,0,0);
 const end=new Date(today); end.setDate(end.getDate()+3); // 4-day window (today+1+2+3)
 const startISO=iso(today), endISO=iso(end);

 // Groomer app only loads the active four-day work window.
 const {data:appts,error:e1}=await db.from('appointments')
  .select('*')
  .eq('groomer_id',currentGroomer.id)
  .gte('appt_date',startISO)
  .lte('appt_date',endISO)
 .order('appt_date')
 .order('appt_time');
 if(e1){content.innerHTML='<div class="empty">Error loading: '+esc(e1.message)+'</div>';return}

 if(!appts||!appts.length){
  dataCache={appts:[],dogs:[],custs:[]};
  renderActiveTab();
  return;
 }

 // Fetch related dogs first
 const dogIds=[...new Set(appts.map(a=>a.dog_id).filter(Boolean))];
 const dr=dogIds.length
  ?await db.from('dogs').select('id,name,breed,size,coat,coat_color,prefs,skin_history,styling_refs,customer_id').in('id',dogIds)
  :{data:[]};
 const allDogs=dr.data||[];
 // Derive customer IDs from dogs (appointments don't have customer_id, only dog_id)
 const custIds=[...new Set(allDogs.map(d=>d.customer_id).filter(Boolean))];
 const cr=custIds.length
  ?await db.from('customers').select('id,owner,address,kecamatan,kota,gmaps_link').in('id',custIds)
  :{data:[]};
 dataCache={appts,dogs:allDogs,custs:cr.data||[]};
 updateCounts();
 renderActiveTab();
}

function updateCounts(){
 const today=iso(new Date());
 const tmw=new Date();tmw.setDate(tmw.getDate()+1);const tmwISO=iso(tmw);
 const d2=new Date();d2.setDate(d2.getDate()+2);const d2ISO=iso(d2);
 const d3=new Date();d3.setDate(d3.getDate()+3);const d3ISO=iso(d3);
 const c={today:0,tomorrow:0,later:0};
 dataCache.appts.forEach(a=>{
  if(a.appt_date===today) c.today++;
  else if(a.appt_date===tmwISO) c.tomorrow++;
  else if(a.appt_date===d2ISO||a.appt_date===d3ISO) c.later++;
 });
 document.getElementById('cnt-today').textContent=c.today;
 document.getElementById('cnt-tomorrow').textContent=c.tomorrow;
 document.getElementById('cnt-later').textContent=c.later;
}

function switchTab(tab){
 currentTab=tab;
 ['today','tomorrow','later'].forEach(t=>{
  document.getElementById('tab-'+t).classList.toggle('active',t===tab);
 });
 renderActiveTab();
}

// Tool checklist: maps services to required tools
const BASE_TOOLS=[
 {tool:'Clipper set + guards',always:true},
 {tool:'Gunting grooming',always:true},
 {tool:'Sisir & slicker brush',always:true},
 {tool:'Shampoo (regular)',always:true},
 {tool:'Dryer',always:true},
 {tool:'Handuk kerja',always:true},
 {tool:'Gunting kuku + kikir',always:true},
 {tool:'Ear cleaner + cotton',always:true},
 {tool:'Meja grooming portable',always:true},
];
const SERVICE_TOOLS={
 'Styling':[{tool:'Gunting styling (thinning shears)',svc:'Styling'},{tool:'Sisir set lengkap',svc:'Styling'}],
 'Botak':[{tool:'Clipper blade pendek (full shave)',svc:'Botak'}],
 'Dematting':[{tool:'Dematting comb / rake',svc:'Dematting'},{tool:'Slicker brush extra',svc:'Dematting'}],
 'Deshedding':[{tool:'Deshedding tool (FURminator)',svc:'Deshedding'}],
 'Anti Fungal':[{tool:'Shampoo anti-jamur (medicated)',svc:'Anti Fungal'}],
 'Anti Kutu':[{tool:'Shampoo anti-kutu',svc:'Anti Kutu'},{tool:'Sisir kutu (fine-tooth)',svc:'Anti Kutu'}],
 'Whitening':[{tool:'Shampoo whitening',svc:'Whitening'}],
 'Parfume':[{tool:'Cologne / parfume anjing',svc:'Parfume'}],
};
const EXTRA_TOOLS=[{tool:'+2 handuk tambahan',always:true}];

let checklistState={};

function renderToolChecklist(dates){
 const dayAppts=dataCache.appts.filter(a=>dates.includes(a.appt_date));
 if(!dayAppts.length) return '';

 // Extract unique services from all appointments
 const svcs=new Set();
 dayAppts.forEach(a=>{
  const svc=a.service_base||'Basic Grooming';
  // service_base can be comma-separated like "Basic Grooming, Styling, Dematting"
  svc.split(',').forEach(s=>svcs.add(s.trim()));
 });

 // Build tool list: base + service-specific + extra
 const tools=[...BASE_TOOLS];
 Object.keys(SERVICE_TOOLS).forEach(svc=>{
  if(svcs.has(svc)){
   SERVICE_TOOLS[svc].forEach(t=>tools.push(t));
  }
 });
 tools.push(...EXTRA_TOOLS);

 const dateKey=dates.join(',');
 if(!checklistState[dateKey]) checklistState[dateKey]={};
 const state=checklistState[dateKey];
 const allChecked=tools.every((_,i)=>state[i]);

 return `<div class="checklist">
  <div class="checklist-title">
   <span>Checklist Alat</span>
   <button class="checklist-toggle" onclick="toggleChecklist(this)">${allChecked?'Buka':'Tutup'}</button>
  </div>
  <div class="checklist-body${allChecked?' collapsed':''}" id="chk-body-${dateKey.replace(/,/g,'-')}">
   ${tools.map((t,i)=>{
    const checked=!!state[i];
    const reason=t.svc?` (${t.svc})`:(t.always?'':'');
    return `<div class="chk-item${checked?' checked':''}" onclick="toggleChk('${dateKey}',${i},this)">
     <div class="chk-box">${checked?'&#10003;':''}</div>
     <span class="chk-label">${esc(t.tool)}<span class="chk-reason">${reason}</span></span>
    </div>`;
   }).join('')}
  </div>
 </div>`;
}

function toggleChk(dateKey,idx,el){
 if(!checklistState[dateKey]) checklistState[dateKey]={};
 checklistState[dateKey][idx]=!checklistState[dateKey][idx];
 const checked=checklistState[dateKey][idx];
 el.classList.toggle('checked',checked);
 el.querySelector('.chk-box').innerHTML=checked?'&#10003;':'';
}

function toggleChecklist(btn){
 const body=btn.closest('.checklist').querySelector('.checklist-body');
 const collapsed=body.classList.toggle('collapsed');
 btn.textContent=collapsed?'Buka':'Tutup';
}

function renderActiveTab(){
 const content=document.getElementById('content');
 const today=iso(new Date());
 const tmw=new Date();tmw.setDate(tmw.getDate()+1);const tmwISO=iso(tmw);
 const d2=new Date();d2.setDate(d2.getDate()+2);const d2ISO=iso(d2);
 const d3=new Date();d3.setDate(d3.getDate()+3);const d3ISO=iso(d3);

 let dates;
 if(currentTab==='today') dates=[today];
 else if(currentTab==='tomorrow') dates=[tmwISO];
 else dates=[d2ISO,d3ISO];

 const sections=dates.map(date=>{
  const dayAppts=dataCache.appts.filter(a=>a.appt_date===date)
   .sort((a,b)=>(a.appt_time||'').localeCompare(b.appt_time||''));
  const isToday=date===today;
  return {date,isToday,appts:dayAppts};
 });

 const hasAny=sections.some(s=>s.appts.length>0);
 if(!hasAny){
  content.innerHTML='<div class="empty">Tidak ada jadwal grooming untuk periode ini.<br><br>Refresh nanti untuk update.</div>';
  return;
 }

 // Compute global late banner (first group of today, first appt in that group)
 const now=new Date();
 const todayISO=now.toISOString().slice(0,10);
 const todaySec=sections.find(s=>s.isToday);
 let globalLateBanner='';
 if(todaySec&&todaySec.appts.length){
  const todayGroups=groupApptsByCustomer(todaySec.appts);
  const firstAppt=todayGroups[0]?.[0];
  if(firstAppt&&!firstAppt.photos?.absency){
   const [ah,am]=(firstAppt.appt_time||'00:00').split(':').map(Number);
   if(now.getHours()*60+now.getMinutes()>=ah*60+am+LATE_GRACE_MINUTES){
    globalLateBanner=`<div id="late-banner" style="background:#dc2626;color:#fff;padding:12px 16px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:10px;border-radius:8px;margin-bottom:12px">
     <span style="font-size:22px">&#9888;</span>
     <div>
      <div>Terlambat upload foto absen!</div>
      <div style="font-size:11px;font-weight:400;opacity:.9">Harap upload foto kehadiran sekarang untuk jadwal jam ${String(ah).padStart(2,'0')}:${String(am).padStart(2,'0')}.</div>
     </div>
    </div>`;
   }
  }
 }

 content.innerHTML=globalLateBanner+renderToolChecklist(dates)+sections.map(({date,isToday,appts})=>{
  if(!appts.length) return '';
  const groups=groupApptsByCustomer(appts);
  return `<div class="day-section">
   <div class="day-header ${isToday?'today':''}">${esc(fmtDateLong(date))}</div>
   ${groups.map((group,gi)=>group.length>1?renderGroupedAppt(group,gi===0&&isToday,isToday):renderAppt(group[0],gi===0&&isToday)).join('')}
  </div>`;
 }).join('');
}

function getAttendanceResult(a){
 if((a.late_minutes||0)>=LATE_GRACE_MINUTES) return {label:'Late',color:'#991b1b',bg:'#fee2e2'};
 const attendance=a.photos?.absency;
 if(!attendance) return {label:'Belum ada foto absen',color:'#92400e',bg:'#fef3c7'};
 const uploadedAt=photoTS(attendance);
 if(uploadedAt){
  const start=new Date(`${a.appt_date}T${(a.appt_time||'00:00').slice(0,5)}:00`);
  const uploaded=new Date(uploadedAt);
  if(!isNaN(start.getTime())&&!isNaN(uploaded.getTime())&&uploaded.getTime()>=start.getTime()+LATE_GRACE_MINUTES*60*1000){
   return {label:'Late',color:'#991b1b',bg:'#fee2e2'};
  }
 }
 if(!uploadedAt&&a.absency_late) return {label:'Late',color:'#991b1b',bg:'#fee2e2'};
 return {label:'On time',color:'#15803d',bg:'#dcfce7'};
}

function attendanceBadge(a){
 const s=getAttendanceResult(a);
 return `<span style="font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;background:${s.bg};color:${s.color};white-space:nowrap">${s.label}</span>`;
}

function isStyleRefExpired(ref){
 if(!ref?.uploaded_at) return false;
 const days=Math.floor((Date.now()-new Date(ref.uploaded_at).getTime())/(86400000));
 return days>60;
}

function groupApptsByCustomer(appts){
 const sorted=[...appts].sort((a,b)=>(a.appt_time||'').localeCompare(b.appt_time||''));
 const groups=[];
 sorted.forEach(a=>{
  const dog=dataCache.dogs.find(d=>d.id===a.dog_id);
  const custId=dog?.customer_id;
  if(custId&&groups.length){
   const last=groups[groups.length-1];
   const lastA=last[last.length-1];
   const lastDog=dataCache.dogs.find(d=>d.id===lastA.dog_id);
   const lastEndMin=parseInt((lastA.appt_time||'00:00').split(':')[0])*60+parseInt((lastA.appt_time||'00:00').split(':')[1])+(lastA.duration_mins||60);
   const startMin=parseInt((a.appt_time||'00:00').split(':')[0])*60+parseInt((a.appt_time||'00:00').split(':')[1]);
   if(lastDog?.customer_id===custId&&startMin<=lastEndMin+15){last.push(a);return;}
  }
  groups.push([a]);
 });
 return groups;
}

 const absencyMeta=firstA.photos?.absency?.timestamp?`<div class="photo-meta">${fmtPhotoTS(firstA.photos.absency.timestamp)}${firstA.photos.absency.lat?` · <a href="https://maps.google.com/?q=${firstA.photos.absency.lat},${firstA.photos.absency.lng}" target="_blank" style="color:var(--primary)">📍 Lokasi</a>`:''}</div>`:'';
 // Per-dog sections (before/after/ears/conditions + groomer notes)
 const dogSections=group.map(a=>{
  const dog=dataCache.dogs.find(d=>d.id===a.dog_id)||{};
  const refs=Array.isArray(dog.styling_refs)?dog.styling_refs.filter(r=>!isStyleRefExpired(r)):[];
  const svc=a.service_base||'Basic Grooming';

  const groomerNote=(a.groomer_field_note||'').trim();

  const stylingBlock=refs.length?`<div class="dog-styling"><div class="dog-styling-label">Styling references (${refs.length})</div><div class="dog-styling-imgs">${refs.slice(0,6).map(r=>`<a href="${esc(r.url)}" target="_blank"><img src="${esc(r.url)}" alt="ref"/></a>`).join('')}</div></div>`:'';

   }
  });
  photosHTML+='</div>';
  return `<div style="border-top:1px solid var(--border);margin-top:12px;padding-top:12px">

 if(!dog||!cust) return ''; // skip if related data missing

 {key:'ear_left',label:'Telinga Kiri',section:'Telinga'},

 {key:'clean_area',label:'Area Kemaluan',section:'Kebersihan',full:true}, // Session C item 6
 {key:'dematting',label:'Bulu Gimbal',section:'Dokumentasi Kondisi',multi:true,conditional:'Dematting'},
 {key:'fungal',label:'Bekas Jamur',multi:true},
 {key:'injury',label:'Luka',multi:true},
 {key:'other',label:'Lainnya',multi:true},
];

function renderPhotoGrid(a){
 const photos=a.photos||{};
 const svc=a.service_base||'';
 let html='<div class="appt-photos">';
 let lastSection='';
 PHOTO_TYPES.forEach(pt=>{
  if(pt.conditional&&!svc.includes(pt.conditional)) return;
  if(pt.section&&pt.section!==lastSection){
   html+=`<div class="photo-section-label">${pt.section}</div>`;
   lastSection=pt.section;
  }
  if(pt.multi){
   html+=renderMultiSlot(a.id,photos,pt);
  } else {
   const val=photos[pt.key];
   const url=typeof val==='object'?val?.url:val;
   html+=`<div class="photo-slot${pt.full?' full':''}">
    <div class="photo-slot-label">${pt.label}</div>
    ${renderSingleSlot(a.id,url,pt.key,pt.hasGeo)}

   </div>`;
  }
 });
 html+='</div>';
 return html;

 let html=`<div class="photo-multi">
  <div class="photo-slot-label" style="width:100%">${pt.label}${arr.length?` (${arr.length})`:''}  </div>`;
 arr.forEach((value,i)=>{
  const url=photoUrl(value);
  if(!url) return;
  html+=`<div class="photo-slot">
   <div class="photo-preview">
    <img src="${esc(url)}" alt="${pt.key} ${i+1}" onclick="openLightbox('${esc(url).replace(/'/g,"\\'")}',this)" style="cursor:zoom-in"/>
    <button class="photo-del" onclick="event.stopPropagation();deleteMultiPhoto('${apptId}','${pt.key}',${i})" title="Hapus">&times;</button>
   </div>
   ${photoTS(value)?`<div class="photo-meta">${fmtPhotoTS(photoTS(value))}</div>`:''}
  </div>`;
 });
 if(arr.length<10){
  html+=`<div class="photo-add">
   <div class="photo-btn" onclick="capturePhoto('${apptId}','${pt.key}',false,true)" style="min-height:50px">
    <span class="photo-btn-icon">&#128247;</span>
    <span class="photo-btn-text">Kamera</span>
   </div>
   <div class="photo-btn" onclick="capturePhoto('${apptId}','${pt.key}',false,true,true)" style="aspect-ratio:auto;min-height:32px;border-style:solid;border-width:1px;margin-top:4px">
    <span class="photo-btn-text">Galeri</span>
   </div>
  </div>`;
 }
 html+='</div>';
 return html;
}

let _pendingApptId=null;
let _pendingType=null;
let _pendingGeo=false;
let _pendingMulti=false;

let _groomerNoteTimers={};
function saveGroomerNote(apptId,val){
 clearTimeout(_groomerNoteTimers[apptId]);
 _groomerNoteTimers[apptId]=setTimeout(async()=>{
  await db.from('appointments').update({groomer_field_note:val.trim()||null}).eq('id',apptId);
  const appt=dataCache.appts.find(a=>a.id===apptId);
  if(appt) appt.groomer_field_note=val.trim()||null;
 },800);
}

function capturePhoto(apptId,type,hasGeo,multi,fromGallery){
 _pendingApptId=apptId;
 _pendingType=type;
 _pendingGeo=!!hasGeo;
 _pendingMulti=!!multi;
 const input=document.getElementById(fromGallery?'cam-gallery':'cam-input');
 input.value='';
 input.click();
}

function getGeoPosition(){
 return new Promise(resolve=>{
  if(!navigator.geolocation){resolve(null);return}
  navigator.geolocation.getCurrentPosition(
   pos=>resolve({lat:pos.coords.latitude,lng:pos.coords.longitude}),
   ()=>resolve(null),
   {enableHighAccuracy:true,timeout:10000,maximumAge:0}
  );
 });
}

async function onPhotoCapture(input){
 const file=input.files?.[0];
 if(!file||!_pendingApptId) return;
 const apptId=_pendingApptId;
 const type=_pendingType;
 const hasGeo=_pendingGeo;
 const isMulti=_pendingMulti;
 _pendingApptId=null;

 // Show loading in-place
 renderActiveTab();

 try {
  const blob=await compressImage(file);
  const appt=dataCache.appts.find(a=>a.id===apptId);
  const photos={...(appt?.photos||{})};

  if(isMulti){
   const arr=Array.isArray(photos[type])?[...photos[type]]:[];
   const idx=arr.length;
   const path=`${apptId}/${type}_${idx}.jpg`;
   const {error:upErr}=await db.storage.from('grooming-photos').upload(path,blob,{contentType:'image/jpeg',upsert:true});
   if(upErr) throw upErr;
   const {data:urlData}=db.storage.from('grooming-photos').getPublicUrl(path);
   arr.push({url:urlData.publicUrl+'?v='+Date.now(),timestamp:new Date().toISOString()});
   photos[type]=arr;
  } else {
   const path=`${apptId}/${type}.jpg`;
   const {error:upErr}=await db.storage.from('grooming-photos').upload(path,blob,{contentType:'image/jpeg',upsert:true});
   if(upErr) throw upErr;
   const {data:urlData}=db.storage.from('grooming-photos').getPublicUrl(path);
   const publicUrl=urlData.publicUrl+'?v='+Date.now();
   if(hasGeo){
    const geo=await getGeoPosition();
    photos[type]={url:publicUrl,timestamp:new Date().toISOString(),lat:geo?.lat||null,lng:geo?.lng||null};
   } else {
    photos[type]={url:publicUrl,timestamp:new Date().toISOString()};
   }
  }

  const {error:dbErr}=await db.from('appointments').update({photos}).eq('id',apptId);
  if(dbErr) throw dbErr;
  // If absency photo uploaded late, set absency_late=true (persists even if photo later deleted)
  if(type==='absency'&&hasGeo){
   const aRef=dataCache.appts.find(a=>a.id===apptId);
   if(aRef){
    const [ah,am]=(aRef.appt_time||'00:00').split(':').map(Number);
    const apptStart=new Date(aRef.appt_date+'T'+String(ah).padStart(2,'0')+':'+String(am).padStart(2,'0')+':00');
    if(new Date().getTime()>=apptStart.getTime()+LATE_GRACE_MINUTES*60*1000){
     await db.from('appointments').update({absency_late:true}).eq('id',apptId);
     if(aRef) aRef.absency_late=true;
    }
   }
  }
  if(appt) appt.photos=photos;
  renderActiveTab();
 } catch(err) {
  alert('Upload gagal: '+(err.message||err));
  renderActiveTab();
 }
}

async function deletePhoto(apptId,type){
 if(!confirm('Hapus foto ini?')) return;
 try {
  await db.storage.from('grooming-photos').remove([`${apptId}/${type}.jpg`]);
  const appt=dataCache.appts.find(a=>a.id===apptId);
  const photos={...(appt?.photos||{})};
  delete photos[type];
  const {error}=await db.from('appointments').update({photos}).eq('id',apptId);
  if(error) throw error;
  if(appt) appt.photos=photos;
  renderActiveTab();
 } catch(err){
  alert('Gagal hapus: '+(err.message||err));
 }
}

async function deleteMultiPhoto(apptId,type,idx){
 if(!confirm('Hapus foto ini?')) return;
 try {
  await db.storage.from('grooming-photos').remove([`${apptId}/${type}_${idx}.jpg`]);
  const appt=dataCache.appts.find(a=>a.id===apptId);
  const photos={...(appt?.photos||{})};
  const arr=Array.isArray(photos[type])?[...photos[type]]:[];
  arr.splice(idx,1);
  photos[type]=arr.length?arr:undefined;
  if(!photos[type]) delete photos[type];
  const {error}=await db.from('appointments').update({photos}).eq('id',apptId);
  if(error) throw error;
  if(appt) appt.photos=photos;
  renderActiveTab();
 } catch(err){
  alert('Gagal hapus: '+(err.message||err));
 }
}

function compressImage(file,maxW=1200){
 return new Promise((resolve,reject)=>{
  const img=new Image();
  img.onload=()=>{
   let w=img.width,h=img.height;
   if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
   const c=document.createElement('canvas');
   c.width=w;c.height=h;
   c.getContext('2d').drawImage(img,0,0,w,h);
   c.toBlob(b=>{
    if(b) resolve(b); else reject(new Error('Compression failed'));
   },'image/jpeg',0.8);
   URL.revokeObjectURL(img.src);
  };
  img.onerror=()=>reject(new Error('Cannot read image'));
  img.src=URL.createObjectURL(file);
 });
}

// Auto-refresh every 5 minutes
setInterval(()=>{if(currentGroomer)loadSchedule()},5*60*1000);

// Init on load
init();
</script>
